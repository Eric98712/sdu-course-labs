<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="60" y="44" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">路线B：WirelessAgent</text>
  <rect x="60" y="90" width="1160" height="40" rx="6" fill="#E8F4FC"/>
  <rect x="60" y="90" width="6" height="40" fill="#0066CC"/>
  <text x="80" y="116" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">WirelessAgent: LLM Agents for Intelligent Wireless Networks | arXiv 2025.05 | 代码开源</text>
  <rect x="60" y="150" width="560" height="240" rx="8" fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1"/>
  <rect x="60" y="150" width="6" height="40" fill="#CC0000"/>
  <text x="85" y="178" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#CC0000">核心架构</text>
  <rect x="80" y="200" width="520" height="40" rx="6" fill="#E8F4FC"/>
  <text x="340" y="226" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#003366">四模块认知架构（镜像人类认知）</text>
  <text x="85" y="265" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">① 感知（Perception）：观察网络状态和环境</text>
  <text x="85" y="290" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">② 记忆（Memory）：保留历史经验与上下文</text>
  <text x="85" y="315" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">③ 规划（Planning）：基于目标制定策略</text>
  <text x="85" y="340" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">④ 行动（Action）：在网络中执行决策</text>
  <text x="85" y="368" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#999999">基于 LangGraph 架构实现</text>
  <rect x="660" y="150" width="560" height="240" rx="8" fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1"/>
  <rect x="660" y="150" width="6" height="40" fill="#CC0000"/>
  <text x="685" y="178" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#CC0000">实验结果（网络切片）</text>
  <rect x="680" y="200" width="520" height="50" rx="6" fill="#E8F4FC"/>
  <text x="940" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#003366">+44.4%</text>
  <text x="940" y="243" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">带宽利用率 vs Prompt-based方法</text>
  <rect x="680" y="260" width="520" height="50" rx="6" fill="#E8F4FC"/>
  <text x="940" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#003366">4.3%</text>
  <text x="940" y="303" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">仅低于规则最优解</text>
  <rect x="680" y="325" width="520" height="50" rx="6" fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1"/>
  <text x="685" y="348" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#003366">R1版本</text>
  <text x="685" y="368" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">CSI缺失 + Agent + 预测模型 → RMSE降低67%</text>
  <text x="80" y="440" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#003366">与路线A的关键区别</text>
  <rect x="60" y="465" width="560" height="150" rx="8" fill="#E8F4FC"/>
  <rect x="60" y="465" width="6" height="150" fill="#0066CC"/>
  <text x="85" y="495" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• LLM不做信号理解，而是做推理编排</text>
  <text x="85" y="520" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 工具调用获取专业分析结果</text>
  <text x="85" y="545" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 发挥LLM长板（推理/规划/对话）</text>
  <text x="85" y="570" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 回避短板（信号处理交给专业工具）</text>
  <rect x="660" y="465" width="560" height="150" rx="8" fill="#FFF0F0" stroke="#CC0000" stroke-width="1"/>
  <rect x="660" y="465" width="6" height="150" fill="#CC0000"/>
  <text x="685" y="495" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#CC0000">路线B的优势</text>
  <text x="685" y="520" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#333333">✓ 调用现成工具，无需大量标注数据</text>
  <text x="685" y="543" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#333333">✓ 推理过程可审计可溯源</text>
  <text x="685" y="566" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#333333">✓ 新任务 = 新工具，无需重新训练</text>
  <text x="685" y="589" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#333333">✓ 可控制硬件、已有商用落地</text>
  <rect x="0" y="665" width="1280" height="55" fill="#F5F7FA"/>
  <text x="60" y="698" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">范式之争 | 路线B</text>
  <text x="1240" y="698" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">08 / 15</text>
</svg>
