<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="60" y="44" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">未来方向与开放问题</text>
  <rect x="60" y="90" width="1160" height="40" rx="6" fill="#E8F4FC"/>
  <rect x="60" y="90" width="6" height="40" fill="#0066CC"/>
  <text x="80" y="116" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">两个范式都远未成熟，以下是值得关注的方向</text>
  <rect x="60" y="150" width="560" height="160" rx="8" fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1"/>
  <rect x="60" y="150" width="6" height="40" fill="#003366"/>
  <text x="85" y="178" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#003366">路线A的未来</text>
  <text x="85" y="215" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 真实空口数据验证（最重要）</text>
  <text x="85" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 多模态融合（IQ+频谱图+文本）</text>
  <text x="85" y="265" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 更大基座模型的 scaling law 验证</text>
  <rect x="660" y="150" width="560" height="160" rx="8" fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1"/>
  <rect x="660" y="150" width="6" height="40" fill="#CC0000"/>
  <text x="685" y="178" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#CC0000">路线B的未来</text>
  <text x="685" y="215" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• Agent 安全性与可靠性增强</text>
  <text x="685" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 标准化协议（MCP for RF）</text>
  <text x="685" y="265" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 多 Agent 协作与竞争机制</text>
  <rect x="60" y="340" width="1160" height="200" rx="8" fill="#E8F4FC"/>
  <rect x="60" y="340" width="6" height="200" fill="#0066CC"/>
  <text x="85" y="375" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#003366">关键开放问题</text>
  <text x="85" y="410" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">Q1: VLM能否在真实RF数据上达到可用的准确率？</text>
  <text x="85" y="440" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">Q2: Agent 系统如何保证LLM幻觉不会导致错误操作？</text>
  <text x="85" y="470" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">Q3: 融合架构中，VLM应该作为Agent的一个"工具"吗？</text>
  <text x="85" y="500" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">Q4: 6G AI-native 网络最终会选择哪条路线？</text>
  <rect x="0" y="665" width="1280" height="55" fill="#F5F7FA"/>
  <text x="60" y="698" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">范式之争 | 文献综述</text>
  <text x="1240" y="698" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">12 / 14</text>
</svg>
