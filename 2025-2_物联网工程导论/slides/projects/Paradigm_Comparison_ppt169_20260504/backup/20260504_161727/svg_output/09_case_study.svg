<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="60" y="44" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">案例研究：检测非法干扰</text>
  <rect x="60" y="90" width="1160" height="40" rx="6" fill="#E8F4FC"/>
  <rect x="60" y="90" width="6" height="40" fill="#0066CC"/>
  <text x="80" y="116" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">同一任务："分析 2.4GHz 频段是否存在非法干扰"——两条路线的不同做法</text>
  <rect x="60" y="150" width="560" height="470" rx="8" fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1"/>
  <rect x="60" y="150" width="560" height="40" rx="8" fill="#003366"/>
  <rect x="60" y="150" width="6" height="40" fill="#CC0000"/>
  <text x="340" y="178" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">路线A：VLM内化感知</text>
  <rect x="80" y="210" width="520" height="55" rx="6" fill="#FFFFFF" stroke="#D0D7E0" stroke-width="1"/>
  <text x="95" y="235" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">① SDR采集IQ → 转频谱图</text>
  <text x="95" y="255" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">② 问VLM："这个频段有没有异常干扰？"</text>
  <text x="80" y="285" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">③ VLM输出：</text>
  <rect x="80" y="300" width="520" height="50" rx="6" fill="#FFF0F0"/>
  <text x="95" y="325" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#CC0000">"检测到非WiFi信号，疑似干扰……"</text>
  <rect x="80" y="370" width="520" height="90" rx="6" fill="#FFF0F0" stroke="#CC0000" stroke-width="1"/>
  <text x="95" y="398" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#CC0000">风险</text>
  <text x="95" y="420" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">• 模型没受过真实干扰训练，可能误判</text>
  <text x="95" y="440" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">• 没有法规数据库对照，无法判断"非法"</text>
  <rect x="660" y="150" width="560" height="470" rx="8" fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1"/>
  <rect x="660" y="150" width="560" height="40" rx="8" fill="#CC0000"/>
  <rect x="660" y="150" width="6" height="40" fill="#CC0000"/>
  <text x="940" y="178" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">路线B：智能体协同</text>
  <rect x="680" y="210" width="520" height="55" rx="6" fill="#FFFFFF" stroke="#D0D7E0" stroke-width="1"/>
  <text x="695" y="235" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">① Agent解析意图 → 调用频谱分析API</text>
  <text x="695" y="255" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">② 工具返回各信道占用/功率/信号类型</text>
  <rect x="680" y="280" width="520" height="55" rx="6" fill="#FFFFFF" stroke="#D0D7E0" stroke-width="1"/>
  <text x="695" y="305" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">③ Agent调用FCC数据库查询频率分配</text>
  <text x="695" y="325" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">④ 综合判断，输出带证据的报告</text>
  <rect x="680" y="350" width="520" height="50" rx="6" fill="#E8F4FC"/>
  <text x="695" y="375" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#003366">"信道6存在未授权信号，功率-30dBm，</text>
  <text x="695" y="393" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#003366"> 建议进一步排查"</text>
  <rect x="680" y="420" width="520" height="70" rx="6" fill="#E8F4FC" stroke="#0066CC" stroke-width="1"/>
  <text x="695" y="448" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0066CC">优势</text>
  <text x="695" y="470" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">• 每步可审计、可溯源、可人工干预</text>
  <text x="695" y="488" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">• 结合法规数据库，判断有据可依</text>
  <rect x="0" y="665" width="1280" height="55" fill="#F5F7FA"/>
  <text x="60" y="698" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">范式之争 | 文献综述</text>
  <text x="1240" y="698" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">09 / 14</text>
</svg>
