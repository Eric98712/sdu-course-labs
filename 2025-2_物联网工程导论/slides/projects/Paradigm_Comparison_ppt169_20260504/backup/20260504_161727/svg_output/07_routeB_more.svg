<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="60" y="44" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">路线B（续）：产业落地与新架构</text>
  <rect x="60" y="90" width="1160" height="40" rx="6" fill="#E8F4FC"/>
  <rect x="60" y="90" width="6" height="40" fill="#0066CC"/>
  <text x="80" y="116" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">商用产品 + 学术前沿 — 路线B已经进入产业化阶段</text>
  <rect x="60" y="150" width="560" height="200" rx="8" fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1"/>
  <rect x="60" y="150" width="6" height="40" fill="#CC0000"/>
  <text x="85" y="178" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#CC0000">raNora — Aircom 商用 Agent AI（2026.03）</text>
  <text x="85" y="215" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 首个商用的电信 Agent AI 平台</text>
  <text x="85" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 多 Agent 协作：数据库Agent + 覆盖Agent</text>
  <text x="85" y="265" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 功能：合规审计、站点规划、覆盖分析</text>
  <text x="85" y="290" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 基于电信领域训练的 LLM 推理引擎</text>
  <text x="85" y="320" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#666666">意义：证明 Agent 路线在工业场景可落地</text>
  <rect x="660" y="150" width="560" height="200" rx="8" fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1"/>
  <rect x="660" y="150" width="6" height="40" fill="#CC0000"/>
  <text x="685" y="178" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#CC0000">Multi-LLM Agent DRL（KTH, 2025-2026）</text>
  <text x="685" y="215" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 每个基站/UE 部署一个 LLM Agent</text>
  <text x="685" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 混合架构：</text>
  <text x="700" y="265" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">- LLM 做高层：协商、合作、策略适配</text>
  <text x="700" y="290" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">- DRL 做低层：功率分配、波束赋形</text>
  <text x="685" y="320" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#666666">面向 6G 的可扩展方案</text>
  <text x="80" y="400" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#003366">路线B的优势</text>
  <rect x="60" y="420" width="560" height="180" rx="8" fill="#E8F4FC"/>
  <rect x="60" y="420" width="6" height="180" fill="#0066CC"/>
  <text x="85" y="450" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">✅ 可调用现成工具（信号处理/小模型/数据库）</text>
  <text x="85" y="475" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">✅ 推理过程可审计、可溯源</text>
  <text x="85" y="500" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">✅ 扩展灵活：新任务 = 新工具</text>
  <text x="85" y="525" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">✅ 可控制硬件设备（频谱仪/基站）</text>
  <text x="85" y="550" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">✅ 已有商用落地（raNora）</text>
  <rect x="660" y="420" width="560" height="180" rx="8" fill="#FFF0F0" stroke="#CC0000" stroke-width="1"/>
  <rect x="660" y="420" width="6" height="180" fill="#CC0000"/>
  <text x="685" y="450" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#CC0000">路线B的劣势</text>
  <text x="685" y="475" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">❌ 系统架构复杂（多组件编排）</text>
  <text x="685" y="500" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">❌ 延迟较高（多轮工具调用）</text>
  <text x="685" y="525" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">❌ LLM幻觉风险（需校验机制）</text>
  <text x="685" y="550" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">❌ 学术发表较难（偏工程实现）</text>
  <rect x="0" y="665" width="1280" height="55" fill="#F5F7FA"/>
  <text x="60" y="698" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">范式之争 | 文献综述</text>
  <text x="1240" y="698" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">07 / 14</text>
</svg>
