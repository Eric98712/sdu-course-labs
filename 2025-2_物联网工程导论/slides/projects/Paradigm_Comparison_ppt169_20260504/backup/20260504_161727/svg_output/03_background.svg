<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="60" y="44" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">背景与核心问题</text>
  <rect x="60" y="90" width="1160" height="40" rx="6" fill="#E8F4FC"/>
  <rect x="60" y="90" width="6" height="40" fill="#0066CC"/>
  <text x="80" y="116" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">大模型空前成功 → 无线通信领域能否受益？→ 两条路线的分歧</text>
  <rect x="60" y="150" width="560" height="200" rx="8" fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1"/>
  <rect x="60" y="150" width="6" height="40" fill="#CC0000"/>
  <text x="80" y="178" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#333333">大模型的成功</text>
  <text x="80" y="215" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• LLM：ChatGPT/GPT-4/Claude — 文本生成、推理、代码</text>
  <text x="80" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• VLM：Qwen2.5-VL/GPT-4o — 视觉理解、图文推理</text>
  <text x="80" y="265" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• Agent：工具调用、多步规划、自主决策</text>
  <rect x="660" y="150" width="560" height="200" rx="8" fill="#FFF0F0" stroke="#CC0000" stroke-width="1"/>
  <rect x="660" y="150" width="6" height="40" fill="#CC0000"/>
  <text x="680" y="178" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#CC0000">射频智能的特殊挑战</text>
  <text x="680" y="215" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• RF数据高采样率、复数域、时变特性</text>
  <text x="680" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 标注数据昂贵，真实场景标签难以获取</text>
  <text x="680" y="265" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 需要硬件控制能力（非纯感知任务）</text>
  <text x="80" y="400" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#003366">核心分歧</text>
  <rect x="60" y="420" width="1160" height="100" rx="8" fill="#E8F4FC"/>
  <rect x="60" y="420" width="6" height="100" fill="#0066CC"/>
  <text x="640" y="455" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#003366">大模型应该"学会"理解射频信号，还是"调用"工具来分析射频信号？</text>
  <text x="640" y="485" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">内化感知 vs 工具协同 — 两条路线的根本分歧</text>
  <rect x="0" y="665" width="1280" height="55" fill="#F5F7FA"/>
  <text x="60" y="698" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">范式之争 | 文献综述</text>
  <text x="1240" y="698" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">03 / 14</text>
