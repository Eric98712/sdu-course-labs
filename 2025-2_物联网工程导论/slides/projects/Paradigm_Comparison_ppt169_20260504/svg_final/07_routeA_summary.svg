  <text x="60" y="44" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">路线A：Seeing Radio + 路线小结</text>
  <path fill="#E8F4FC" d="M66,90 H1214 A6,6 0 0 1 1220,96 V124 A6,6 0 0 1 1214,130 H66 A6,6 0 0 1 60,124 V96 A6,6 0 0 1 66,90 Z" />
  <rect x="60" y="90" width="6" height="40" fill="#0066CC" />
  <text x="80" y="116" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">Seeing Radio — RF-GPT 的前序工作 | 同团队 | arXiv 2026.01</text>
  <path fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1" d="M68,150 H612 A8,8 0 0 1 620,158 V342 A8,8 0 0 1 612,350 H68 A8,8 0 0 1 60,342 V158 A8,8 0 0 1 68,150 Z" />
  <rect x="60" y="150" width="6" height="40" fill="#003366" />
  <text x="85" y="178" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#003366">Seeing Radio 核心发现</text>
  <text x="85" y="215" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 三种可视化方式对比：</text>
  <text x="100" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#666666">时域轨迹 / 幅度谱图 / 联合表示</text>
  <text x="85" y="270" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 57类调制识别：微调后~90%（基模~10%）</text>
  <text x="85" y="295" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">• 对噪声鲁棒，可泛化到未见过的调制类型</text>
  <text x="85" y="325" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#999999">→ 证明了 VLM 从零学会 RF 感知的可行性</text>
  <path fill="#FFF0F0" stroke="#CC0000" stroke-width="1" d="M668,150 H1212 A8,8 0 0 1 1220,158 V342 A8,8 0 0 1 1212,350 H668 A8,8 0 0 1 660,342 V158 A8,8 0 0 1 668,150 Z" />
  <rect x="660" y="150" width="6" height="200" fill="#CC0000" />
  <text x="685" y="178" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#CC0000">路线A的共同问题</text>
  <text x="685" y="215" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">① 全合成数据，真实信号泛化存疑</text>
  <text x="685" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">② 只和通用VLM比，未与RF专用模型比</text>
  <text x="685" y="265" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">③ 端到端黑箱，推理过程不可审计</text>
  <text x="685" y="290" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">④ 无法控制硬件，仅限识别任务</text>
  <text x="685" y="315" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">⑤ 无架构创新（VLM+线性投影）</text>
  <path fill="#E8F4FC" d="M68,380 H1212 A8,8 0 0 1 1220,388 V572 A8,8 0 0 1 1212,580 H68 A8,8 0 0 1 60,572 V388 A8,8 0 0 1 68,380 Z" />
  <rect x="60" y="380" width="6" height="200" fill="#0066CC" />
  <text x="640" y="415" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#003366">路线A小结</text>
  <text x="640" y="450" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#003366">✅ 优势</text>
  <text x="640" y="478" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">端到端简洁、单一模型统一多任务、学术上有发表价值</text>
  <text x="640" y="510" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#CC0000">❌ 劣势</text>
  <text x="640" y="538" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">合成→真实泛化鸿沟、对比基线弱、黑箱推理、无硬件控制、架构创新不足</text>
  <text x="640" y="565" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#666666">整体评价：思路有亮点（VLM+频谱图），但论文完整度距离顶会标准有明显差距</text>
  <rect x="0" y="665" width="1280" height="55" fill="#F5F7FA" />
  <text x="60" y="698" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">范式之争 | 路线A</text>
  <text x="1240" y="698" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">07 / 15</text>
