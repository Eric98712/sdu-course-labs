<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="70" fill="#003366" />
  <rect x="0" y="0" width="6" height="70" fill="#CC0000" />
  <text x="60" y="44" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">案例研究：检测非法干扰</text>
  <path fill="#E8F4FC" d="M66,90 H1214 A6,6 0 0 1 1220,96 V124 A6,6 0 0 1 1214,130 H66 A6,6 0 0 1 60,124 V96 A6,6 0 0 1 66,90 Z" />
  <rect x="60" y="90" width="6" height="40" fill="#0066CC" />
  <text x="80" y="116" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">任务："分析 2.4GHz 频段是否存在非法干扰" — 两条路线分别怎么做？</text>
  <path fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1" d="M68,150 H612 A8,8 0 0 1 620,158 V612 A8,8 0 0 1 612,620 H68 A8,8 0 0 1 60,612 V158 A8,8 0 0 1 68,150 Z" />
  <path fill="#003366" d="M68,150 H612 A8,8 0 0 1 620,158 V182 A8,8 0 0 1 612,190 H68 A8,8 0 0 1 60,182 V158 A8,8 0 0 1 68,150 Z" />
  <rect x="60" y="150" width="6" height="40" fill="#CC0000" />
  <text x="340" y="178" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">路线A：VLM内化感知</text>
  <path fill="#FFFFFF" stroke="#D0D7E0" stroke-width="1" d="M86,210 H594 A6,6 0 0 1 600,216 V284 A6,6 0 0 1 594,290 H86 A6,6 0 0 1 80,284 V216 A6,6 0 0 1 86,210 Z" />
  <text x="95" y="238" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">① SDR采集IQ → 转频谱图</text>
  <text x="95" y="263" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">② 问VLM："这个频段有没有异常干扰？"</text>
  <text x="80" y="310" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">③ VLM输出：</text>
  <path fill="#FFF0F0" d="M86,330 H594 A6,6 0 0 1 600,336 V374 A6,6 0 0 1 594,380 H86 A6,6 0 0 1 80,374 V336 A6,6 0 0 1 86,330 Z" />
  <text x="95" y="355" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#CC0000">"检测到非WiFi信号，疑似干扰……"</text>
  <path fill="#FFF0F0" stroke="#CC0000" stroke-width="1" d="M86,400 H594 A6,6 0 0 1 600,406 V494 A6,6 0 0 1 594,500 H86 A6,6 0 0 1 80,494 V406 A6,6 0 0 1 86,400 Z" />
  <text x="95" y="428" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#CC0000">风险</text>
  <text x="95" y="452" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">• 模型没受过真实干扰训练，可能误判</text>
  <text x="95" y="475" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">• 没有法规数据库对照，无法判断"非法"</text>
  <path fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1" d="M668,150 H1212 A8,8 0 0 1 1220,158 V612 A8,8 0 0 1 1212,620 H668 A8,8 0 0 1 660,612 V158 A8,8 0 0 1 668,150 Z" />
  <path fill="#CC0000" d="M668,150 H1212 A8,8 0 0 1 1220,158 V182 A8,8 0 0 1 1212,190 H668 A8,8 0 0 1 660,182 V158 A8,8 0 0 1 668,150 Z" />
  <rect x="660" y="150" width="6" height="40" fill="#CC0000" />
  <text x="940" y="178" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">路线B：智能体协同</text>
  <path fill="#FFFFFF" stroke="#D0D7E0" stroke-width="1" d="M686,210 H1194 A6,6 0 0 1 1200,216 V259 A6,6 0 0 1 1194,265 H686 A6,6 0 0 1 680,259 V216 A6,6 0 0 1 686,210 Z" />
  <text x="695" y="235" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">① Agent解析意图 → 调用频谱分析工具</text>
  <text x="695" y="258" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">② 工具返回各信道占用/功率/信号类型</text>
  <path fill="#FFFFFF" stroke="#D0D7E0" stroke-width="1" d="M686,280 H1194 A6,6 0 0 1 1200,286 V329 A6,6 0 0 1 1194,335 H686 A6,6 0 0 1 680,329 V286 A6,6 0 0 1 686,280 Z" />
  <text x="695" y="305" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">③ Agent调用FCC数据库查询频率分配</text>
  <text x="695" y="328" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">④ 综合判断 → 输出带证据的报告</text>
  <path fill="#E8F4FC" d="M686,350 H1194 A6,6 0 0 1 1200,356 V404 A6,6 0 0 1 1194,410 H686 A6,6 0 0 1 680,404 V356 A6,6 0 0 1 686,350 Z" />
  <text x="695" y="378" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#003366">"信道6存在未授权信号，功率-30dBm，</text>
  <text x="695" y="398" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#003366"> 建议进一步排查"</text>
  <path fill="#E8F4FC" stroke="#0066CC" stroke-width="1" d="M686,430 H1194 A6,6 0 0 1 1200,436 V504 A6,6 0 0 1 1194,510 H686 A6,6 0 0 1 680,504 V436 A6,6 0 0 1 686,430 Z" />
  <text x="695" y="458" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0066CC">优势</text>
  <text x="695" y="480" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">• 每步可审计、可溯源、可人工干预</text>
  <text x="695" y="500" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">• 结合法规数据库，判断有据可依</text>
  <rect x="0" y="665" width="1280" height="55" fill="#F5F7FA" />
  <text x="60" y="698" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">范式之争 | 综合比较</text>
  <text x="1240" y="698" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#999999">12 / 15</text>
</svg>