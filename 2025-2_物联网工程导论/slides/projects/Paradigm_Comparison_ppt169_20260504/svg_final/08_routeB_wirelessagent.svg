  <text x="685" y="178" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#CC0000">实验结果（网络切片）</text>
  <path fill="#E8F4FC" d="M686,200 H1194 A6,6 0 0 1 1200,206 V244 A6,6 0 0 1 1194,250 H686 A6,6 0 0 1 680,244 V206 A6,6 0 0 1 686,200 Z" />
  <text x="940" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#003366">+44.4%</text>
  <text x="940" y="243" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#666666">带宽利用率 vs Prompt-based方法</text>
  <path fill="#E8F4FC" d="M686,260 H1194 A6,6 0 0 1 1200,266 V304 A6,6 0 0 1 1194,310 H686 A6,6 0 0 1 680,304 V266 A6,6 0 0 1 686,260 Z" />
