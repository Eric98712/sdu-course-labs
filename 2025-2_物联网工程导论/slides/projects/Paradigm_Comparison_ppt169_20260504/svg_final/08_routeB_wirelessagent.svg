  <path fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1" d="M68,150 H612 A8,8 0 0 1 620,158 V382 A8,8 0 0 1 612,390 H68 A8,8 0 0 1 60,382 V158 A8,8 0 0 1 68,150 Z" />
