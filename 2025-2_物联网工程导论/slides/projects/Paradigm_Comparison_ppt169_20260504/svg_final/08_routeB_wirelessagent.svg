  <text x="685" y="520" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#333333">✓ 调用现成工具，无需大量标注数据</text>
  <text x="685" y="543" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#333333">✓ 推理过程可审计可溯源</text>
  <text x="685" y="566" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#333333">✓ 新任务 = 新工具，无需重新训练</text>
  <text x="685" y="589" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#333333">✓ 可控制硬件、已有商用落地</text>
