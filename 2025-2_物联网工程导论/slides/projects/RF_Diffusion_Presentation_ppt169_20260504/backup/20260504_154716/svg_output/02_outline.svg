  <text x="485" y="520" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">与RF-GPT等对比</text>
  <text x="485" y="548" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">为什么这篇更有分量</text>
  <rect x="860" y="410" width="360" height="240" rx="10" fill="#F5F7FA"/><rect x="860" y="410" width="360" height="6" rx="3" fill="#FF6F00"/>
  <text x="885" y="450" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#FF6F00">06</text>
  <text x="885" y="488" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="bold" fill="#263238">总结</text>
  <text x="885" y="520" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">贡献 + 局限 + 未来方向</text>
