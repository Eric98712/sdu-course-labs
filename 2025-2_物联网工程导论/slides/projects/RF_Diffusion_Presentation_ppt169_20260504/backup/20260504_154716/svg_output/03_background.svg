  <rect x="60" y="420" width="560" height="120" rx="10" fill="#FFEBEE"/><rect x="60" y="420" width="560" height="5" rx="2.5" fill="#C62828"/>
  <text x="85" y="455" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" font-weight="bold" fill="#C62828">环境建模法</text>
  <text x="85" y="480" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#546E7A">射线追踪+3D模型 → 成本高、忽略材料特性、难生成时序数据</text>
  <rect x="660" y="420" width="560" height="120" rx="10" fill="#FFEBEE"/><rect x="660" y="420" width="560" height="5" rx="2.5" fill="#C62828"/>
