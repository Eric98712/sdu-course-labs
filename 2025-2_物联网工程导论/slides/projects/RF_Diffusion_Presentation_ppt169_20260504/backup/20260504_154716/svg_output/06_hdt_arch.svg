<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <rect x="60" y="50" width="6" height="36" fill="#1565C0"/>
  <text x="80" y="78" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="40" font-weight="bold" fill="#263238">Hierarchical Diffusion Transformer</text>
  <rect x="60" y="115" width="1160" height="1" fill="#ECEFF1"/>
  <rect x="60" y="140" width="370" height="500" rx="10" fill="#F5F7FA"/>
  <rect x="60" y="140" width="370" height="5" rx="2.5" fill="#1565C0"/>
  <text x="245" y="180" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="bold" fill="#1565C0">① 分层架构</text>
  <text x="245" y="210" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#546E7A">Hierarchical Architecture</text>
  <rect x="80" y="235" width="330" height="110" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="95" y="265" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#263238">解耦 RF 数据的时空维度</text>
  <text x="95" y="290" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#263238">层次化处理多尺度时频特征</text>
  <text x="95" y="315" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#263238">捕捉长时间序列的依赖关系</text>
  <rect x="80" y="365" width="330" height="80" rx="8" fill="#E3F2FD"/>
  <text x="245" y="395" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1565C0">全局 → 局部 → 细节</text>
  <text x="245" y="420" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1565C0">多粒度特征提取</text>
  <rect x="455" y="140" width="370" height="500" rx="10" fill="#F5F7FA"/>
  <rect x="455" y="140" width="370" height="5" rx="2.5" fill="#1565C0"/>
  <text x="640" y="180" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="bold" fill="#1565C0">② Attention扩散块</text>
  <text x="640" y="210" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#546E7A">Attention-based Diffusion Block</text>
  <rect x="475" y="235" width="330" height="110" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="490" y="265" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#263238">基于 Transformer 的扩散块</text>
  <text x="490" y="290" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#263238">自注意力机制提取 RF 特征</text>
  <text x="490" y="315" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#263238">优于传统 U-Net 架构</text>
  <rect x="475" y="365" width="330" height="80" rx="8" fill="#E3F2FD"/>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1565C0">多头自注意力 × 前馈网络</text>
  <text x="640" y="420" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1565C0">时序建模能力更强</text>
  <rect x="850" y="140" width="370" height="500" rx="10" fill="#F5F7FA"/>
  <rect x="850" y="140" width="370" height="5" rx="2.5" fill="#FF6F00"/>
  <text x="1035" y="180" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="bold" fill="#E65100">③ 复数算子</text>
  <text x="1035" y="210" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#546E7A">Complex-valued Operator</text>
  <rect x="870" y="235" width="330" height="110" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="885" y="265" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#263238">同时编码幅度和相位信息</text>
  <text x="885" y="290" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#263238">支持复数域神经网络运算</text>
  <text x="885" y="315" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#263238">区别于现有模型的实值处理</text>
  <rect x="870" y="365" width="330" height="80" rx="8" fill="#FFF3E0"/>
  <text x="1035" y="395" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#E65100">复数卷积 / 复数激活</text>
  <text x="1035" y="420" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#E65100">相位信息对无线系统至关重要</text>
  <rect x="60" y="700" width="1160" height="1" fill="#ECEFF1"/>
  <text x="60" y="714" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">RF-Diffusion Presentation</text>
  <text x="1260" y="714" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">06 / 12</text>
</svg>
