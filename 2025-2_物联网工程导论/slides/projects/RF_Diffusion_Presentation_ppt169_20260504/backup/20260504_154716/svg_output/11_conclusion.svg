  <text x="660" y="419" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#1565C0">扩展到 5G NR / LoRa / 蓝牙等更多信号类型</text>
  <rect x="640" y="440" width="580" height="35" rx="6" fill="#E3F2FD"/>
  <text x="660" y="464" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#1565C0">加速采样（扩散模型加速技术）</text>
  <rect x="640" y="485" width="580" height="35" rx="6" fill="#E3F2FD"/>
  <text x="660" y="509" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#1565C0">与 LLM/Agent 结合 → 频谱监测与自动决策</text>
  <rect x="60" y="700" width="1160" height="1" fill="#ECEFF1"/>
  <text x="60" y="714" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">RF-Diffusion Presentation</text>
  <text x="1260" y="714" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">11 / 12</text>
