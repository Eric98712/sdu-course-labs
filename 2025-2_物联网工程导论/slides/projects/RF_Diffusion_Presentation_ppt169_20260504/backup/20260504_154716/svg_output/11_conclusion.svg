  <text x="85" y="240" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#263238">首个适配RF信号特性的</text>
  <text x="85" y="262" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#263238">扩散生成模型</text>
  <text x="85" y="284" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#263238">MobiCom 2024 CCF-A</text>
  <rect x="455" y="180" width="370" height="150" rx="10" fill="#E3F2FD"/>
  <circle cx="485" cy="215" r="18" fill="#1565C0"/>
  <text x="485" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="515" y="210" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" font-weight="bold" fill="#1565C0">TFD + HDT</text>
  <text x="480" y="240" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#263238">时频域扩散理论</text>
  <text x="480" y="262" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#263238">分层 Diffusion Transformer</text>
  <text x="480" y="284" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#263238">支持复数域运算</text>
  <rect x="850" y="180" width="370" height="150" rx="10" fill="#E3F2FD"/>
  <circle cx="880" cy="215" r="18" fill="#1565C0"/>
  <text x="880" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="910" y="210" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" font-weight="bold" fill="#1565C0">全面实验验证</text>
  <text x="875" y="240" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#263238">Wi-Fi + FMCW 实测</text>
  <text x="875" y="262" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#263238">手势识别 + 信道估计</text>
  <text x="875" y="284" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#263238">代码+预训练模型开源</text>
