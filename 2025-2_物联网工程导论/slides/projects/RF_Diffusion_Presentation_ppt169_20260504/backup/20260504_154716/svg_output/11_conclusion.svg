  <rect x="60" y="180" width="370" height="150" rx="10" fill="#E3F2FD"/>
  <circle cx="90" cy="215" r="18" fill="#1565C0"/>
  <text x="90" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1</text>
