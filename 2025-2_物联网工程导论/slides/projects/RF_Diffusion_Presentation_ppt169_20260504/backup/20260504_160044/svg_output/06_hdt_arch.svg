  <text x="245" y="355" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#003366">全局 → 局部 → 细节</text>
  <rect x="455" y="150" width="370" height="460" rx="8" fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1"/>
  <rect x="455" y="150" width="370" height="40" rx="8" fill="#003366"/>
  <rect x="455" y="150" width="6" height="40" fill="#CC0000"/>
