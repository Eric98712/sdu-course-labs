  <rect x="80" y="210" width="330" height="100" rx="6" fill="#FFFFFF" stroke="#D0D7E0" stroke-width="1"/>
  <text x="95" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">解耦 RF 的时空维度</text>
  <text x="95" y="265" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">层次化多尺度时频特征</text>
  <text x="95" y="290" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#333333">捕捉长时间序列依赖</text>
