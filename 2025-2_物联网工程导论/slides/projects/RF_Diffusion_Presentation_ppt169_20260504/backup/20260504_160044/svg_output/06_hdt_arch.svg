  <rect x="60" y="90" width="6" height="40" fill="#0066CC"/>
  <text x="80" y="116" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">分层架构 · Attention扩散块 · 复数算子 —— 三层协同设计</text>
  <rect x="60" y="150" width="370" height="460" rx="8" fill="#F5F7FA" stroke="#D0D7E0" stroke-width="1"/>
  <rect x="60" y="150" width="370" height="40" rx="8" fill="#003366"/>
