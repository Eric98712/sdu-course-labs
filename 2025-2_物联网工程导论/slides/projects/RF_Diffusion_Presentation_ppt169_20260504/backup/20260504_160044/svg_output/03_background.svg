  <text x="80" y="238" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#333333">Midjourney / DALL-E</text>
  <text x="80" y="275" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#666666">图像生成革命</text>
