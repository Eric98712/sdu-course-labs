<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgDecor" x1="85%" y1="15%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1565C0" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect width="1280" height="720" fill="url(#bgDecor)" />
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0" />

  
  <rect x="60" y="50" width="6" height="36" fill="#1565C0" />
  <text x="80" y="78" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="40" font-weight="bold" fill="#263238">RF-GPT 核心架构</text>
  <rect x="60" y="115" width="1160" height="1" fill="#ECEFF1" />

  
  
  <path fill="#E3F2FD" d="M90,160 H350 A10,10 0 0 1 360,170 V330 A10,10 0 0 1 350,340 H90 A10,10 0 0 1 80,330 V170 A10,10 0 0 1 90,160 Z" />
  <path fill="#1565C0" d="M82.50,160 H357.50 A2.50,2.50 0 0 1 360,162.50 V162.50 A2.50,2.50 0 0 1 357.50,165 H82.50 A2.50,2.50 0 0 1 80,162.50 V162.50 A2.50,2.50 0 0 1 82.50,160 Z" />
  <text x="220" y="205" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" font-weight="bold" fill="#1565C0">RF 编码器</text>
  <text x="220" y="235" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">IQ 信号 → 频谱图</text>
  <text x="220" y="260" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">↓</text>
  <text x="220" y="285" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">视觉编码器 (ViT)</text>
  <text x="220" y="310" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#90A4AE">→ RF Tokens (1369个)</text>

  
  <line x1="360" y1="250" x2="430" y2="250" stroke="#1565C0" stroke-width="3" />
  <polygon points="430,242 448,250 430,258" fill="#1565C0" />

  
  <path fill="#E8F5E9" d="M460,160 H720 A10,10 0 0 1 730,170 V330 A10,10 0 0 1 720,340 H460 A10,10 0 0 1 450,330 V170 A10,10 0 0 1 460,160 Z" />
  <path fill="#2E7D32" d="M452.50,160 H727.50 A2.50,2.50 0 0 1 730,162.50 V162.50 A2.50,2.50 0 0 1 727.50,165 H452.50 A2.50,2.50 0 0 1 450,162.50 V162.50 A2.50,2.50 0 0 1 452.50,160 Z" />
  <text x="590" y="205" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" font-weight="bold" fill="#2E7D32">RF 适配器</text>
  <text x="590" y="240" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">线性投影层</text>
  <text x="590" y="270" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">d → dLM 维度映射</text>
  <text x="590" y="310" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#90A4AE">类似 LLaVA 投影模块</text>

  
  <line x1="730" y1="250" x2="800" y2="250" stroke="#1565C0" stroke-width="3" />
  <polygon points="800,242 818,250 800,258" fill="#1565C0" />

  
  <path fill="#FFF3E0" d="M830,160 H1170 A10,10 0 0 1 1180,170 V330 A10,10 0 0 1 1170,340 H830 A10,10 0 0 1 820,330 V170 A10,10 0 0 1 830,160 Z" />
  <path fill="#FF6F00" d="M822.50,160 H1177.50 A2.50,2.50 0 0 1 1180,162.50 V162.50 A2.50,2.50 0 0 1 1177.50,165 H822.50 A2.50,2.50 0 0 1 820,162.50 V162.50 A2.50,2.50 0 0 1 822.50,160 Z" />
  <text x="1000" y="205" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" font-weight="bold" fill="#E65100">Decoder-only LLM</text>
  <text x="1000" y="240" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">RF Tokens 作为前缀</text>
  <text x="1000" y="265" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">+ 文本指令</text>
  <text x="1000" y="290" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">→ RF-grounded 文本输出</text>
  <text x="1000" y="315" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#90A4AE">Qwen2.5-VL (3B / 7B)</text>

  
  <path fill="#F5F7FA" stroke="#1565C0" stroke-width="1" d="M90,380 H1190 A10,10 0 0 1 1200,390 V470 A10,10 0 0 1 1190,480 H90 A10,10 0 0 1 80,470 V390 A10,10 0 0 1 90,380 Z" />
  <text x="110" y="420" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="bold" fill="#1565C0">关键洞察</text>
  <text x="110" y="452" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#263238">RF信号 → 频谱图(图像) → 复用VLM视觉编码能力 → 轻量适配器注入LLM</text>

  
  <path fill="#FFF8E1" stroke="#FF6F00" stroke-width="1" d="M90,510 H1190 A10,10 0 0 1 1200,520 V620 A10,10 0 0 1 1190,630 H90 A10,10 0 0 1 80,620 V520 A10,10 0 0 1 90,510 Z" />
  <text x="110" y="548" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="bold" fill="#FF6F00">类比理解</text>
  <text x="110" y="580" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#263238">就像医生看心电图（将心脏电信号转为二维图）来诊断病情，RF-GPT 将无线电波转为</text>
  <text x="110" y="608" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#263238">频谱图来"诊断"无线环境。传统方法好比每个病都要重新学一套诊断工具。</text>

  
  <rect x="60" y="700" width="1160" height="1" fill="#ECEFF1" />
  <text x="60" y="714" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">RF-GPT Presentation</text>
  <text x="1260" y="714" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">05 / 15</text>
</svg>