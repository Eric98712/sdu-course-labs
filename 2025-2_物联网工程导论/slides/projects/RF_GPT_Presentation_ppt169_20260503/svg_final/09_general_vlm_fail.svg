  <text x="680" y="205" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#546E7A">"该频谱图为5G NR下行链路，FR2频段。SSB采用Case D</text>
  <text x="680" y="225" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#546E7A">传输模式，PDCCH活跃。未检测到CSI-RS。数据载荷占用</text>
  <text x="680" y="245" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#546E7A">一个连续的PRB块，占用的带宽中等…"</text>
