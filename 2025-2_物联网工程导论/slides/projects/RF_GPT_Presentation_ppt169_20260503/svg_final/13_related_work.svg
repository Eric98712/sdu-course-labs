  <text x="875" y="281" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#546E7A">预训练VLM + 轻量适配器</text>
  <text x="875" y="304" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#546E7A">注入新模态（动作/RF）</text>
