<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgDecor" x1="85%" y1="15%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1565C0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect width="1280" height="720" fill="url(#bgDecor)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>

  <!-- Title -->
  <rect x="60" y="50" width="6" height="36" fill="#1565C0"/>
  <text x="80" y="78" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="40" font-weight="bold" fill="#263238">传统射频智能的困境</text>
  <rect x="60" y="115" width="1160" height="1" fill="#ECEFF1"/>

  <!-- Four quadrant cards (2x2) -->
  <!-- Q1: Task-specific -->
  <rect x="80" y="150" width="530" height="225" rx="10" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="80" y="150" width="530" height="5" rx="2.5" fill="#C62828"/>
  <text x="110" y="200" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#C62828">01</text>
  <text x="160" y="200" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" font-weight="bold" fill="#263238">任务特定模型</text>
  <text x="110" y="235" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#546E7A">每种RF任务各自独立架构、独立数据集、独立训练</text>
  <text x="110" y="265" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#546E7A">调制识别、信道估计、波束选择各需不同模型</text>
  <text x="110" y="295" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#546E7A">跨任务复用几乎为零，重复建设严重</text>
  <text x="110" y="340" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#90A4AE">代码复用率低，维护成本高</text>

  <!-- Q2: Data annotation -->
  <rect x="670" y="150" width="530" height="225" rx="10" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="670" y="150" width="530" height="5" rx="2.5" fill="#C62828"/>
  <text x="700" y="200" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#C62828">02</text>
  <text x="750" y="200" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" font-weight="bold" fill="#263238">数据标注昂贵</text>
  <text x="700" y="235" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#546E7A">RF数据集需专家标注 + 专用硬件 + 长时间采集</text>
  <text x="700" y="265" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#546E7A">真实环境类别高度不平衡</text>
  <text x="700" y="295" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#546E7A">罕见干扰模式几乎无法采集</text>
  <text x="700" y="340" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#90A4AE">大规模监督学习难以实现</text>

  <!-- Q3: Generalization -->
  <rect x="80" y="410" width="530" height="225" rx="10" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="80" y="410" width="530" height="5" rx="2.5" fill="#C62828"/>
  <text x="110" y="460" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#C62828">03</text>
  <text x="160" y="460" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" font-weight="bold" fill="#263238">缺乏泛化能力</text>
  <text x="110" y="495" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#546E7A">一种SNR/信道条件下训练，换环境就性能骤降</text>
  <text x="110" y="525" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#546E7A">硬件差异、信道变化直接影响模型准确率</text>
  <text x="110" y="555" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#546E7A">实际部署需反复重新训练</text>
  <text x="110" y="600" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#90A4AE">换场景即失效，鲁棒性差</text>

  <!-- Q4: Interaction -->
  <rect x="670" y="410" width="530" height="225" rx="10" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="670" y="410" width="530" height="5" rx="2.5" fill="#C62828"/>
  <text x="700" y="460" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#C62828">04</text>
  <text x="750" y="460" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" font-weight="bold" fill="#263238">缺乏交互界面</text>
  <text x="700" y="495" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#546E7A">传统RF模型只输出标签或数值</text>
  <text x="700" y="525" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#546E7A">无法解释"为什么"</text>
  <text x="700" y="555" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#546E7A">无法回答后续问题</text>
  <text x="700" y="600" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#90A4AE">人机交互体验差</text>

  <!-- Footer -->
  <rect x="60" y="700" width="1160" height="1" fill="#ECEFF1"/>
  <text x="60" y="714" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">RF-GPT Presentation</text>
  <text x="1260" y="714" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">04 / 15</text>
</svg>
