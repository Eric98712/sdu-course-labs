<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <rect x="60" y="50" width="6" height="36" fill="#1565C0"/>
  <text x="80" y="78" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="40" font-weight="bold" fill="#263238">为什么选频谱图而非原始IQ？</text>
  <rect x="60" y="115" width="1160" height="1" fill="#ECEFF1"/>

  <!-- Left: reasons -->
  <!-- Reason 1 -->
  <rect x="60" y="140" width="560" height="90" rx="10" fill="#F5F7FA"/>
  <circle cx="90" cy="185" r="18" fill="#1565C0"/>
  <text x="90" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="125" y="180" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" font-weight="bold" fill="#263238">计算可行性</text>
  <text x="125" y="210" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">IQ采样率过高，直接输入Transformer计算不可行</text>

  <!-- Reason 2 -->
  <rect x="60" y="245" width="560" height="90" rx="10" fill="#F5F7FA"/>
  <circle cx="90" cy="290" r="18" fill="#1565C0"/>
  <text x="90" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="125" y="285" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" font-weight="bold" fill="#263238">天然时频表示</text>
  <text x="125" y="315" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">调制方式、带宽、重叠呈现为几何特征</text>

  <!-- Reason 3 -->
  <rect x="60" y="350" width="560" height="90" rx="10" fill="#F5F7FA"/>
  <circle cx="90" cy="395" r="18" fill="#1565C0"/>
  <text x="90" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="125" y="390" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" font-weight="bold" fill="#263238">复用预训练能力</text>
  <text x="125" y="420" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">视觉编码器可提取频谱图的通用语义结构</text>

  <!-- Limitation note -->
  <rect x="60" y="465" width="560" height="80" rx="10" fill="#FFF3E0" stroke="#FF6F00" stroke-width="1"/>
  <text x="90" y="495" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#E65100">局限性</text>
  <text x="90" y="522" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#546E7A">丢失绝对相位信息；本文感知任务不依赖相位</text>

  <!-- Right: technology gallery -->
  <rect x="660" y="140" width="560" height="490" rx="10" fill="#F5F7FA"/>
  <text x="940" y="178" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="bold" fill="#263238">六种无线技术频谱图</text>
  <rect x="660" y="190" width="560" height="1" fill="#ECEFF1"/>

  <!-- 6 tech labels in a 2x3 grid -->
  <rect x="690" y="210" width="240" height="80" rx="8" fill="#E3F2FD"/>
  <text x="810" y="258" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" font-weight="bold" fill="#1565C0">5G NR</text>

  <rect x="950" y="210" width="240" height="80" rx="8" fill="#E3F2FD"/>
  <text x="1070" y="258" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" font-weight="bold" fill="#1565C0">LTE</text>

  <rect x="690" y="310" width="240" height="80" rx="8" fill="#E8F5E9"/>
  <text x="810" y="358" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" font-weight="bold" fill="#2E7D32">UMTS</text>

  <rect x="950" y="310" width="240" height="80" rx="8" fill="#E8F5E9"/>
  <text x="1070" y="358" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" font-weight="bold" fill="#2E7D32">WLAN</text>

  <rect x="690" y="410" width="240" height="80" rx="8" fill="#FFF3E0"/>
  <text x="810" y="458" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" font-weight="bold" fill="#E65100">DVB-S2</text>

  <rect x="950" y="410" width="240" height="80" rx="8" fill="#FFF3E0"/>
  <text x="1070" y="458" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" font-weight="bold" fill="#E65100">Bluetooth</text>

  <text x="940" y="550" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#90A4AE">STFT变换 → 512×512像素 → 1369个RF token</text>

  <!-- Footer -->
  <rect x="60" y="700" width="1160" height="1" fill="#ECEFF1"/>
  <text x="60" y="714" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">RF-GPT Presentation</text>
  <text x="1260" y="714" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">06 / 15</text>
</svg>
