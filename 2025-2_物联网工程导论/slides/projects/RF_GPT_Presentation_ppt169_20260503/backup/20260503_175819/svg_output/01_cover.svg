  </text>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="77" font-weight="bold" fill="#FFFFFF">
    the Wireless World
  </text>

  <!-- Subtitle -->
  <rect x="540" y="430" width="200" height="3" fill="#FF6F00"/>
  <text x="640" y="470" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="29" fill="#BBDEFB">
