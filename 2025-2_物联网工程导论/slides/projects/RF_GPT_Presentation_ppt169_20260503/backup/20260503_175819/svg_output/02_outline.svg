  <text x="80" y="78" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="40" font-weight="bold" fill="#263238">汇报提纲</text>
  <text x="80" y="100" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#90A4AE">OUTLINE</text>

  <!-- Divider -->
