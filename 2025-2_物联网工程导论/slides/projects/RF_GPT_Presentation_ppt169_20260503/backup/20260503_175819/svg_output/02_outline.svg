  <rect x="460" y="140" width="360" height="240" rx="10" fill="#F5F7FA"/>
  <rect x="460" y="140" width="360" height="6" rx="3" fill="#1565C0"/>
  <text x="485" y="180" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="40" font-weight="bold" fill="#1565C0">02</text>
  <text x="485" y="215" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="bold" fill="#263238">RF-GPT 核心思路</text>
  <text x="485" y="245" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">三大组件架构</text>
  <text x="485" y="270" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">为何选择频谱图</text>
  <text x="485" y="295" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">类比：RF全科医生</text>

  <!-- Column 1: Data -->
  <rect x="860" y="140" width="360" height="240" rx="10" fill="#F5F7FA"/>
  <rect x="860" y="140" width="360" height="6" rx="3" fill="#FF6F00"/>
