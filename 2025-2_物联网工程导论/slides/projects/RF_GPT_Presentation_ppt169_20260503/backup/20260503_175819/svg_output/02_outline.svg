  <rect x="460" y="410" width="360" height="240" rx="10" fill="#F5F7FA"/>
  <rect x="460" y="410" width="360" height="6" rx="3" fill="#1565C0"/>
  <text x="485" y="450" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="40" font-weight="bold" fill="#1565C0">05</text>
  <text x="485" y="485" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="bold" fill="#263238">相关工作对比</text>
  <text x="485" y="515" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">RF基础模型对比</text>
  <text x="485" y="540" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">Telecom LLMs对比</text>
  <text x="485" y="565" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">与VLA模型的联系</text>

