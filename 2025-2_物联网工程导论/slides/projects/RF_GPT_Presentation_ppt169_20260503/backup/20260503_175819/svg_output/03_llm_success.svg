<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgDecor" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#1565C0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect width="1280" height="720" fill="url(#bgDecor)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>

  <!-- Title -->
  <rect x="60" y="50" width="6" height="36" fill="#1565C0"/>
  <text x="80" y="78" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="40" font-weight="bold" fill="#263238">大模型的成功与缺失的一环</text>
  <rect x="60" y="115" width="1160" height="1" fill="#ECEFF1"/>

  <!-- Three column cards -->
  <!-- Card 1: LLM -->
  <rect x="60" y="150" width="360" height="450" rx="10" fill="#F5F7FA"/>
  <rect x="60" y="150" width="360" height="180" rx="10" fill="#1565C0"/>
  <rect x="60" y="320" width="360" height="10" fill="#1565C0"/>
  <text x="240" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="55" font-weight="bold" fill="#FFFFFF">LLM</text>
  <text x="240" y="290" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">大规模语言模型</text>
  <text x="85" y="370" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#263238">GPT-4o、Gemini、LLaMA</text>
  <text x="85" y="400" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#263238">文本生成、代码合成</text>
  <text x="85" y="430" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#263238">多步推理、工具使用</text>
  <text x="85" y="470" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#263238">自然语言交互界面</text>

  <!-- Card 2: Multimodal -->
  <rect x="460" y="150" width="360" height="450" rx="10" fill="#F5F7FA"/>
  <rect x="460" y="150" width="360" height="180" rx="10" fill="#0D47A1"/>
  <rect x="460" y="320" width="360" height="10" fill="#0D47A1"/>
  <text x="640" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="55" font-weight="bold" fill="#FFFFFF">VLM</text>
  <text x="640" y="290" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">视觉语言模型</text>
  <text x="485" y="370" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#263238">Qwen2.5-VL、InternVL</text>
  <text x="485" y="400" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#263238">"看懂"图像与视频</text>
  <text x="485" y="430" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#263238">Whisper"听懂"音频</text>
  <text x="485" y="470" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#263238">多模态推理能力</text>

  <!-- Card 3: RF Missing -->
  <rect x="860" y="150" width="360" height="450" rx="10" fill="#F5F7FA"/>
  <rect x="860" y="150" width="360" height="180" rx="10" fill="#C62828"/>
  <rect x="860" y="320" width="360" height="10" fill="#C62828"/>
  <text x="1040" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="55" font-weight="bold" fill="#FFFFFF">RF</text>
  <text x="1040" y="290" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">射频信号缺席</text>
  <text x="885" y="370" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#263238">无线通信物理层信号</text>
  <text x="885" y="400" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#C62828">尚未被大模型原生支持</text>
  <text x="885" y="440" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">现有方法：</text>
  <text x="885" y="465" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">任务特定 + 领域专用模型</text>
  <text x="885" y="490" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#546E7A">缺少统一框架</text>

  <!-- Footer -->
  <rect x="60" y="700" width="1160" height="1" fill="#ECEFF1"/>
  <text x="60" y="714" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">RF-GPT Presentation</text>
  <text x="1260" y="714" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">03 / 15</text>
</svg>
