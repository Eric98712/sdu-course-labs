<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <rect x="60" y="50" width="6" height="36" fill="#1565C0"/>
  <text x="80" y="78" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="40" font-weight="bold" fill="#263238">调制分类与重叠检测结果</text>
  <rect x="60" y="115" width="1160" height="1" fill="#ECEFF1"/>

  <!-- WBMC Section -->
  <text x="80" y="155" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" font-weight="bold" fill="#1565C0">WBMC — 宽带调制分类</text>

  <rect x="60" y="175" width="560" height="42" rx="4" fill="#1565C0"/>
  <text x="340" y="202" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">任务</text>
  <text x="480" y="202" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">通用VLM</text>
  <text x="580" y="202" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">RF-GPT-7B</text>

  <rect x="60" y="217" width="560" height="42" rx="4" fill="#F5F7FA"/>
  <text x="140" y="244" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#263238">Easy（识别调制族）</text>
  <text x="480" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#C62828">7.0%</text>
  <text x="580" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">82.4%</text>

  <rect x="60" y="259" width="560" height="42" rx="4" fill="#F5F7FA"/>
  <text x="140" y="286" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#263238">Medium（精确调制类）</text>
  <text x="480" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#C62828">5.3%</text>
  <text x="580" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">74.2%</text>

  <rect x="60" y="301" width="560" height="42" rx="4" fill="#F5F7FA"/>
  <text x="140" y="328" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#263238">Hard（全列表识别）</text>
  <text x="480" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#C62828">3.0%</text>
  <text x="580" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">47.8%</text>

  <!-- WBMC note -->
  <text x="80" y="365" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#90A4AE">RF-GPT识别信号数量准确率 ≈ 98%，通用VLM几乎全部失败</text>

  <!-- Divider -->
  <rect x="640" y="140" width="1" height="510" fill="#ECEFF1"/>

  <!-- WBOD Section -->
  <text x="680" y="155" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" font-weight="bold" fill="#1565C0">WBOD — 宽带重叠检测</text>

  <rect x="660" y="175" width="560" height="42" rx="4" fill="#1565C0"/>
  <text x="940" y="202" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">任务</text>
  <text x="1080" y="202" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">通用VLM</text>
  <text x="1180" y="202" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">RF-GPT-7B</text>

  <rect x="660" y="217" width="560" height="42" rx="4" fill="#F5F7FA"/>
  <text x="740" y="244" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#263238">Easy（全局重叠类别）</text>
  <text x="1080" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#C62828">~25%</text>
  <text x="1180" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">91.5%</text>

  <rect x="660" y="259" width="560" height="42" rx="4" fill="#F5F7FA"/>
  <text x="740" y="286" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#263238">Medium（成对重叠类别）</text>
  <text x="1080" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#C62828">~30%</text>
  <text x="1180" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">87.6%</text>

  <rect x="660" y="301" width="560" height="42" rx="4" fill="#F5F7FA"/>
  <text x="740" y="328" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#263238">Hard（重叠程度量化）</text>
  <text x="1080" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#C62828">~12%</text>
  <text x="1180" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">71.7%</text>

  <!-- WBOD note -->
  <text x="680" y="365" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#90A4AE">通用VLM倾向于预测"无重叠"造成偏低分数</text>

  <!-- Key insight row -->
  <rect x="60" y="600" width="1160" height="60" rx="8" fill="#E3F2FD"/>
  <text x="640" y="635" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#1565C0">RF-GPT 在两大基准上全面超越通用 VLM，且在信号数量识别上近乎完美</text>

  <!-- Footer -->
  <rect x="60" y="700" width="1160" height="1" fill="#ECEFF1"/>
  <text x="60" y="714" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">RF-GPT Presentation</text>
  <text x="1260" y="714" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#90A4AE">10 / 15</text>
</svg>
